# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:5000}

# ─── PostgreSQL DataSource ────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transitops}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP (Connection Pool — equivalent to pg Pool in Node)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=2000

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT Configuration ───────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:transitops_super_secret_jwt_key_2024}
app.jwt.expiration-ms=${JWT_EXPIRES_MS:604800000}

# ─── Google OAuth2 ───────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_CALLBACK_URL:http://localhost:5000/api/auth/google/callback}
spring.security.oauth2.client.registration.google.scope=profile,email

# ─── Frontend URL ────────────────────────────────────────────────────────────
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ─── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173},http://localhost:5173,http://localhost:5174

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.transitops=DEBUG
logging.level.org.springframework.security=INFO
